{% if page_obj.paginator.num_pages > 1 %}
<div class="pagination">
  {% if page_obj.has_previous %}
    <a href="?page={{ page_obj.previous_page_number }}{% if query_string %}&{{ query_string }}{% endif %}">上一页</a>
  {% endif %}
  {% for num in page_obj.paginator.page_range %}
    {% if num == page_obj.number %}
      <span class="current">{{ num }}</span>
    {% else %}
      <a href="?page={{ num }}{% if query_string %}&{{ query_string }}{% endif %}">{{ num }}</a>
    {% endif %}
  {% endfor %}
  {% if page_obj.has_next %}
    <a href="?page={{ page_obj.next_page_number }}{% if query_string %}&{{ query_string }}{% endif %}">下一页</a>
  {% endif %}
</div>
{% endif %}
